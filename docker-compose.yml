version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shop_service
    ports:
      - "5400:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      - ENV=${ENV}
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:shop_app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data: